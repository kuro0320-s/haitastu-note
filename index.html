<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配達ノート">
<title>秋元酒店 配達ノート</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ai:#1d2b4a; --ai-2:#2c3d63; --cloth:#f3f5f8; --paper:#ffffff;
  --ink:#16191f; --sub:#5b6474; --line:#d9dee7; --crate:#f2b705; --crate-ink:#3a2c00;
  --danger:#b3261e; --ok:#1f7a4d;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ai:#0f1830; --ai-2:#1f2c4a; --cloth:#12161f; --paper:#1a202c;
    --ink:#eef1f6; --sub:#9aa4b6; --line:#2c3446; --crate:#f2b705; --crate-ink:#2a2000;
    --danger:#ff8a80; --ok:#6fd3a0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ai:#0f1830; --ai-2:#1f2c4a; --cloth:#12161f; --paper:#1a202c;
  --ink:#eef1f6; --sub:#9aa4b6; --line:#2c3446; --crate:#f2b705; --crate-ink:#2a2000;
  --danger:#ff8a80; --ok:#6fd3a0; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
#gateWrap:empty{display:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cloth);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--crate);outline-offset:2px}

/* 前掛け header */
.apron{background:var(--ai);color:#fff;padding:18px 18px 22px;position:relative;overflow:hidden}
.apron::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--crate) 0 18px,transparent 18px 26px)}
.apron h1{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;
  font-size:clamp(30px,9vw,44px);line-height:1.05;margin:0;letter-spacing:.04em}
.apron p{margin:6px 0 0;color:#c9d2e6;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}

.here{display:flex;align-items:center;gap:10px;margin:14px 0 10px;padding:12px 14px;background:var(--paper);
  border:1px solid var(--line);border-radius:12px}
.here .dot{width:12px;height:12px;border-radius:50%;background:var(--sub);flex:none}
.here.on .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.here .txt{flex:1;font-size:14px;color:var(--sub)}
.here .txt b{color:var(--ink);font-weight:700}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ai-2);color:#fff;font-weight:700;cursor:pointer;min-height:44px}
.btn.crate{background:var(--crate);color:var(--crate-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
.notice{margin:10px 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--crate) 22%,var(--paper));font-size:14px}
.notice:empty{display:none}

.list{list-style:none;margin:12px 0 0;padding:0}
.spot{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-left:6px solid var(--ai-2);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.spot .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.spot .name{font-weight:700;font-size:17px}
.spot .dist{flex:none;font-weight:700;color:var(--ai-2);font-size:14px}
:root[data-theme="dark"] .spot .dist{color:var(--crate)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spot .dist{color:var(--crate)}}
.spot .bld{color:var(--sub);font-size:14px}
.spot .last{margin-top:6px;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--cloth)}
.empty{text-align:center;color:var(--sub);padding:30px 10px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1050;
  border:0;border-radius:999px;padding:14px 20px;background:var(--crate);color:var(--crate-ink);
  font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;min-height:52px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:1100;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1101;max-height:92%;overflow:auto;background:var(--paper);
  border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-inner{max-width:640px;margin:0 auto}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0;font-size:22px;line-height:1.3}
.sheet .bldl{color:var(--sub);margin-top:2px}
.block{margin-top:16px}
.block h3{font-size:15px;margin:0 0 6px;color:var(--sub);font-weight:700}
.memo{white-space:pre-wrap;background:var(--cloth);border-radius:10px;padding:10px 12px}
.routes{display:flex;gap:8px;flex-wrap:wrap}
.routes a{flex:1 1 140px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.comments{list-style:none;margin:0;padding:0}
.comments li{padding:8px 0;border-bottom:1px solid var(--line)}
.comments .who{font-size:12px;color:var(--sub)}
.addc{display:flex;gap:8px;margin-top:8px}
.addc input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cloth);min-height:44px}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--sub);margin-top:14px}

form label{display:block;font-weight:700;font-size:14px;margin-top:12px}
form .hint{font-weight:400;color:var(--sub);font-size:12px}
form input,form textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cloth);min-height:44px}
form textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.loc-row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.loc-row small{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:1200;display:none}
.gate{max-width:420px;margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0;color:var(--sub);font-size:14px}
.gate label{display:block;font-weight:700;font-size:14px;margin-top:12px}
.gate input{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cloth);min-height:44px}
.me{font-size:13px;color:#c9d2e6;margin-top:8px}.me button{background:none;border:0;color:var(--crate);text-decoration:underline;padding:0;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:4px;margin:0 0 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;min-height:42px;cursor:pointer;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--ai-2);color:#fff}
.mapwrap{position:relative}
.goal{position:absolute;left:10px;right:10px;top:10px;z-index:900;display:flex;align-items:center;gap:10px;
  background:var(--ai);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.goal .g{flex:1;min-width:0}.goal b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .d{font-family:"Dela Gothic One",sans-serif;font-size:22px;color:var(--crate);line-height:1.2}
.goal button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;min-height:40px;min-width:40px;cursor:pointer}
.goal button.fit{padding:0 10px}
.pin.goalpin{background:#f2b705;border-color:#2c3d63;width:32px;height:32px}
#map{height:66vh;min-height:340px;border-radius:12px;border:1px solid var(--line);margin-top:10px;z-index:0}
#pickMap{height:230px;border-radius:10px;border:1px solid var(--line);margin-top:6px;z-index:0}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:#2c3d63;border:3px solid #f2b705;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.leaflet-container{font-family:inherit}
.pop b{display:block;font-size:15px;line-height:1.3}.pop span{color:#5b6474;font-size:13px}
.georesults{list-style:none;margin:8px 0 0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.georesults button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:44px;cursor:pointer}
.georesults li:last-child button{border-bottom:0}
.pop button{margin-top:8px;width:100%;min-height:38px;padding:6px 10px}
</style>
</head>
<body>
<header class="apron">
  <div class="wrap" style="padding-bottom:0">
    <h1>秋元酒店<br>配達ノート</h1>
    <p>納品先の場所・ビル・搬入のコツをみんなで共有</p>
    <div class="me" id="me" hidden></div>
  </div>
</header>

<div class="wrap" id="gateWrap"></div>
<main class="wrap" id="main" hidden>
  <div class="here" id="here">
    <span class="dot" aria-hidden="true"></span>
    <span class="txt" id="hereTxt">現在地オフ — 近い順に並べるならオンに</span>
    <button class="btn" id="locBtn">現在地</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" id="tabList">リスト</button>
    <button role="tab" aria-selected="false" id="tabMap">地図</button>
  </div>
  <input class="search" id="q" type="search" placeholder="店名・ビル名・住所で検索（Enterで地図検索）" aria-label="検索">
  <div id="geo"></div>
  <div class="notice" id="notice"></div>
  <ul class="list" id="list"><li class="empty">読み込み中…</li></ul>
  <div class="mapwrap" id="mapWrap" hidden>
    <div class="goal" id="goal" hidden>
      <div class="g"><b id="goalName"></b><span class="d" id="goalDist"></span></div>
      <button class="fit" id="goalFit" aria-label="現在地と目的地を両方表示">両方表示</button>
      <button id="goalX" aria-label="目的地を解除">✕</button>
    </div>
    <div id="map"></div>
  </div>
</main>

<button class="fab" id="addBtn" hidden>＋ 納品先を追加</button>

<div class="sheet-bg" id="bg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ===== ここに Apps Script のウェブアプリURLを貼る =====
  const API_URL = "https://script.google.com/macros/s/AKfycbxyMoNE6g5D0z0VhBblVak53KaF81_d8Svo86WIJifnSupC2LekAPbWxiRJibIdnWhi-Q/exec";
  const POLL_MS = 20000;

  const $ = s => document.querySelector(s);
  const LS = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };
  const state = { me:LS.get("hn_name"), spots:[], comments:[], here:null, q:"", openId:null, timer:null };

  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2200); }
  function km(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
    const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
  function dir(a,b){ const y=b.lng-a.lng, x=b.lat-a.lat; const d=(Math.atan2(y*Math.cos(a.lat*Math.PI/180),x)*180/Math.PI+360)%360;
    return ["北","北東","東","南東","南","南西","西","北西"][Math.round(d/45)%8]; }
  function fmtDist(d){ return d<1 ? Math.round(d*100)*10+"m" : d.toFixed(1)+"km"; }
  function hasLL(s){ return typeof s.lat==="number" && typeof s.lng==="number"; }
  function ago(ms){ if(!ms) return ""; const m=Math.floor((Date.now()-ms)/60000);
    if(m<1) return "たった今"; if(m<60) return m+"分前"; const h=Math.floor(m/60); if(h<24) return h+"時間前";
    const d=new Date(ms); return (d.getMonth()+1)+"/"+d.getDate(); }
  function parseLL(str){
    if(!str) return null; try{str=decodeURIComponent(str)}catch{}
    const pats=[/@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|ll|daddr|destination|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /^\s*(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)\s*$/];
    for(const p of pats){ const m=str.match(p); if(m){ const lat=+m[1], lng=+m[2]; if(Math.abs(lat)<=90&&Math.abs(lng)<=180) return {lat,lng}; } }
    return null;
  }

  // ---------- API ----------
  async function load(silent){
    try{
      const r=await fetch(API_URL+"?t="+Date.now());
      const j=await r.json();
      if(!j.ok) return false;
      state.spots=j.spots.map(s=>({...s,lat:s.lat===null?null:+s.lat,lng:s.lng===null?null:+s.lng}));
      state.comments=j.comments;
      $("#notice").textContent="";
      render(); if(state.openId && !$("#f")) paintDetail();
      return true;
    }catch(e){ if(!silent) $("#notice").textContent="読み込めなかった。電波を確認して（自動で再試行するよ）"; return false; }
  }
  async function post(body){
    const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({...body,by:state.me})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"failed");
    return j;
  }
  function startPolling(){
    clearInterval(state.timer);
    state.timer=setInterval(()=>{ if(document.visibilityState==="visible") load(true); },POLL_MS);
  }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.me) load(true); });

  // ---------- gate ----------
  function showGate(msg){
    $("#main").hidden=true; $("#addBtn").hidden=true; $("#me").hidden=true;
    $("#gateWrap").innerHTML=`<form class="gate" id="gate">
      <h2>はじめに</h2><p>コメントに出す名前を入れてね。次からは自動で入る</p>
      ${msg?`<div class="notice">${esc(msg)}</div>`:""}
      <label>名前（コメントに表示）<input name="name" required maxlength="20" placeholder="例：くろ" value="${esc(state.me||"")}"></label>
      <div class="actions"><button class="btn crate" type="submit">はじめる</button></div></form>`;
    $("#gate").onsubmit=async e=>{
      e.preventDefault(); const f=e.target;
      state.me=f.name.value.trim(); if(!state.me) return;
      LS.set("hn_name",state.me); enter(); load(false);
    };
  }
  function enter(){
    $("#gateWrap").innerHTML=""; $("#main").hidden=false; $("#addBtn").hidden=false;
    const me=$("#me"); me.hidden=false; me.innerHTML=`${esc(state.me)} で参加中 ・ <button id="chg">名前を変える</button>`;
    $("#chg").onclick=()=>showGate();
    startPolling();
  }

  // ---------- location ----------
  function locate(cb){
    if(!navigator.geolocation){ toast("この端末では位置情報が使えない"); return; }
    $("#hereTxt").textContent="位置を取得中…";
    navigator.geolocation.getCurrentPosition(p=>{
      state.here={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      $("#here").classList.add("on");
      $("#hereTxt").innerHTML="<b>現在地オン</b> 誤差 約"+Math.round(p.coords.accuracy)+"m";
      render(); drawHere(); cb && cb(state.here);
    },err=>{
      $("#here").classList.remove("on");
      $("#hereTxt").textContent= err.code===1 ? "位置情報が許可されてない（設定→Safari→位置情報）" : "位置を取れなかった。もう一回押してみて";
      cb && cb(null);
    },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  }
  $("#locBtn").onclick=()=>locate();

  // ---------- list ----------
  function filtered(){
    const q=state.q.trim().toLowerCase();
    let arr=state.spots.filter(s=>!q || [s.name,s.building,s.floor,s.address,s.note].join(" ").toLowerCase().includes(q));
    if(state.here){ arr=arr.map(s=>({...s,_d:hasLL(s)?km(state.here,s):Infinity})).sort((a,b)=>a._d-b._d); }
    else arr=[...arr].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ja"));
    return arr;
  }
  function render(){
    drawMarkers();
    const ul=$("#list"); const arr=filtered();
    if(!state.spots.length){ ul.innerHTML='<li class="empty">まだ納品先がない。右下の「＋ 納品先を追加」から最初の1件を登録しよう</li>'; return; }
    if(!arr.length){ ul.innerHTML='<li class="empty">「'+esc(state.q)+'」に当てはまる納品先はない</li>'; return; }
    ul.innerHTML=arr.map(s=>{
      const d = state.here && isFinite(s._d) ? `<span class="dist">${dir(state.here,s)} ${fmtDist(s._d)}</span>` : "";
      const b=[s.building,s.floor].filter(Boolean).join(" ");
      const last = s.lastText ? `<div class="last">💬 ${esc(s.lastText)} <span style="color:var(--sub);font-size:12px">${ago(s.lastAt)}</span></div>` : "";
      return `<li><button class="spot" data-id="${esc(s.id)}"><div class="row"><span class="name">${esc(s.name)}</span>${d}</div>${b?`<div class="bld">🏢 ${esc(b)}</div>`:""}${last}</button></li>`;
    }).join("");
  }
  $("#list").addEventListener("click",e=>{ const b=e.target.closest(".spot"); if(b) openDetail(b.dataset.id); });
  // ---------- search ----------
  let qT;
  $("#q").addEventListener("input",e=>{ state.q=e.target.value; render(); clearTimeout(qT); qT=setTimeout(()=>afterSearch(false),400); });
  $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); $("#q").blur(); afterSearch(true); } });
  function afterSearch(enter){
    const q=state.q.trim(); const geo=$("#geo");
    if(!q){ geo.innerHTML=""; return; }
    const hits=filtered();
    // 地図表示中なら、ヒットした納品先が全部見える位置に移動
    if(M.map && !$("#mapWrap").hidden){
      const ll=hits.filter(hasLL);
      if(ll.length){ M.noFit=true; M.map.fitBounds(ll.map(s=>[s.lat,s.lng]),{padding:[40,40],maxZoom:17}); if(ll.length===1) M.markers[ll[0].id]?.openPopup(); }
    }
    geo.innerHTML=`<button class="btn ghost" id="geoBtn" style="width:100%;margin-top:8px">「${esc(q)}」を住所・地名で地図検索</button>`;
    $("#geoBtn").onclick=()=>geocode(q);
    if(enter && !hits.length) geocode(q);
  }
  // 国土地理院の住所検索（店名は不可、住所・地名・駅名など）
  async function geocode(q){
    const geo=$("#geo"); geo.innerHTML='<div class="notice">検索中…</div>';
    try{
      const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));
      const arr=await r.json();
      if(!Array.isArray(arr) || !arr.length){ geo.innerHTML='<div class="notice">見つからなかった。「高松市〇〇町1-2」みたいに住所で入れてみて（店名は登録済みのものだけ検索できる）</div>'; return; }
      const top=arr.slice(0,6);
      geo.innerHTML='<ul class="georesults">'+top.map((a,i)=>`<li><button data-i="${i}">📍 ${esc(a.properties.title)}</button></li>`).join("")+'</ul>';
      geo.querySelectorAll("button").forEach(b=>b.onclick=()=>{
        const a=top[+b.dataset.i]; const [lng,lat]=a.geometry.coordinates;
        geo.innerHTML=""; showFound(lat,lng,a.properties.title);
      });
    }catch(e){ geo.innerHTML='<div class="notice">住所検索に失敗した。電波を確認してもう一回</div>'; }
  }
  function showFound(lat,lng,title){
    M.noFit=true; setTab("map");
    setTimeout(()=>{
      if(M.found) M.found.remove();
      const div=document.createElement("div"); div.className="pop";
      div.innerHTML=`<b>${esc(title)}</b><button class="btn crate">ここに納品先を追加</button>`;
      div.querySelector("button").onclick=()=>{ M.map.closePopup(); openForm({address:title,lat,lng}); };
      M.found=L.circleMarker([lat,lng],{radius:11,color:"#fff",weight:3,fillColor:"#d93025",fillOpacity:1}).bindPopup(div).addTo(M.map);
      M.map.setView([lat,lng],17); M.found.openPopup();
    },80);
  }

  // ---------- sheet ----------
  function openSheet(html){ killPick(); $("#sheetBody").innerHTML='<div class="grip"></div>'+html; $("#bg").classList.add("open"); $("#sheet").classList.add("open"); }
  function closeSheet(){ killPick(); $("#bg").classList.remove("open"); $("#sheet").classList.remove("open"); state.openId=null; }
  $("#bg").onclick=closeSheet;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

  function routeLinks(s){
    const dest = hasLL(s) ? `${s.lat},${s.lng}` : [s.address,s.building,s.name].filter(Boolean).join(" ");
    const enc=encodeURIComponent(dest);
    return `<div class="routes">
      <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${enc}&travelmode=driving">Googleマップでルート</a>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${enc}&dirflg=d">Appleマップ</a></div>`;
  }
  function detailHTML(s){
    const b=[s.building,s.floor].filter(Boolean).join(" ");
    const dist = state.here && hasLL(s) ? ` ・ ${dir(state.here,s)}に${fmtDist(km(state.here,s))}` : "";
    const cs=state.comments.filter(c=>String(c.spotId)===String(s.id)).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,30);
    const cm = cs.length ? cs.map(c=>`<li><div>${esc(c.text)}</div><div class="who">${esc(c.by)} ・ ${ago(c.at)}</div></li>`).join("") : '<li class="who">まだコメントなし</li>';
    return `
      <h2 id="sheetTitle">${esc(s.name)}</h2>
      <div class="bldl">${b?"🏢 "+esc(b):""}${esc(dist)}</div>
      ${s.address?`<div class="bldl">📍 ${esc(s.address)}</div>`:""}
      ${hasLL(s)?`<div class="block"><button class="btn crate" id="showOnMap" style="width:100%">ここへ行く（地図で現在地と表示）</button></div>`:""}
      <div class="block"><h3>ルート（ナビ）</h3>${routeLinks(s)}
        ${hasLL(s)?"":'<div class="meta">ピン位置が未登録なので住所・店名で検索してる。現地で「編集 → 今いる場所を使う」で精度が上がる</div>'}</div>
      ${s.note?`<div class="block"><h3>納品メモ（搬入口・台車・時間帯など）</h3><div class="memo">${esc(s.note)}</div></div>`:""}
      <div class="block"><h3>一言コメント</h3><ul class="comments">${cm}</ul>
        <div class="addc"><input id="cIn" maxlength="140" placeholder="例：今日は裏口閉まってた" aria-label="一言コメント"><button class="btn crate" id="cSend">送信</button></div></div>
      <div class="actions"><button class="btn ghost" id="edit">編集</button><button class="btn danger" id="del">削除</button></div>
      <div class="meta">登録：${esc(s.createdBy||"")}${s.updatedBy?` ／ 最終更新：${esc(s.updatedBy)} ${ago(s.updatedAt)}`:""}</div>`;
  }
  function paintDetail(){
    const s=state.spots.find(x=>String(x.id)===String(state.openId)); if(!s){ closeSheet(); return; }
    const keep=$("#cIn")?.value||"";
    $("#sheetBody").innerHTML='<div class="grip"></div>'+detailHTML(s);
    if($("#cIn")) $("#cIn").value=keep;
    $("#cSend").onclick=()=>sendComment(s);
    $("#cIn").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing) sendComment(s); });
    $("#edit").onclick=()=>openForm(s);
    $("#showOnMap")?.addEventListener("click",()=>{ closeSheet(); goTo(s.id); });
    $("#del").onclick=()=>delSpot(s);
  }
  function openDetail(id){ state.openId=id; openSheet(""); paintDetail(); }

  async function sendComment(s){
    const inp=$("#cIn"); const text=inp.value.trim(); if(!text) return;
    $("#cSend").disabled=true;
    try{ await post({action:"comment",id:s.id,text}); inp.value=""; toast("コメントを送信した"); await load(true); }
    catch(e){ toast("送信できなかった。もう一回"); }
    finally{ const b=$("#cSend"); if(b) b.disabled=false; }
  }
  async function delSpot(s){
    if(!confirm(`「${s.name}」を削除する？みんなの画面からも消えます`)) return;
    try{ await post({action:"delete",id:s.id}); closeSheet(); toast("削除した"); await load(true); }catch(e){ toast("削除できなかった"); }
  }

  // ---------- form ----------
  function openForm(s){
    s=s||{}; const editing=!!s.id;
    openSheet(`
      <h2 id="sheetTitle">${editing?"納品先を編集":"納品先を追加"}</h2>
      <form id="f" autocomplete="off">
        <label>店名・納品先 *<input name="name" required maxlength="60" value="${esc(s.name)}" placeholder="例：居酒屋〇〇"></label>
        <div class="two">
          <label>ビル名<input name="building" maxlength="60" value="${esc(s.building)}" placeholder="例：〇〇ビル"></label>
          <label>階<input name="floor" maxlength="12" value="${esc(s.floor)}" placeholder="B1 / 3F"></label>
        </div>
        <label>住所<input name="address" maxlength="120" value="${esc(s.address)}" placeholder="例：高松市〇〇町1-2-3"></label>
        <label>ピン位置 <span class="hint">現地でボタンを押すのが一番正確。地図アプリのリンクや「34.34, 134.05」も貼れる</span>
          <input name="ll" value="${hasLL(s)?s.lat.toFixed(6)+", "+s.lng.toFixed(6):""}" placeholder="未登録">
        </label>
        <div class="loc-row"><button type="button" class="btn" id="useHere">今いる場所を使う</button><small id="llMsg">地図をタップしてもピンを置ける</small></div>
        <div id="pickMap"></div>
        <label>納品メモ <span class="hint">搬入口、エレベーター、台車OKか、置き場所、時間帯など</span>
          <textarea name="note" maxlength="600" placeholder="例：裏の搬入口から。EVは奥。空き瓶は勝手口横に回収">${esc(s.note)}</textarea></label>
        <div class="actions"><button class="btn crate" type="submit">${editing?"変更を保存":"追加する"}</button><button class="btn ghost" type="button" id="cancel">やめる</button></div>
      </form>`);
    const f=$("#f");
    $("#cancel").onclick=()=> editing ? openDetail(s.id) : closeSheet();
    const setLL=(lat,lng,zoom)=>{ f.ll.value=lat.toFixed(6)+", "+lng.toFixed(6); placePick(lat,lng,zoom); };
    $("#useHere").onclick=()=>{ $("#llMsg").textContent="取得中…";
      locate(h=>{ if(h){ setLL(h.lat,h.lng,18); $("#llMsg").textContent="誤差 約"+Math.round(h.acc)+"m。ずれてたらピンをドラッグ"; } else $("#llMsg").textContent="取れなかった。地図をタップして置いてね"; }); };
    initPick(hasLL(s)?{lat:s.lat,lng:s.lng}:null, (lat,lng)=>{ f.ll.value=lat.toFixed(6)+", "+lng.toFixed(6); $("#llMsg").textContent="ピンを置いた"; });
    f.ll.addEventListener("change",()=>{ const ll=parseLL(f.ll.value); if(ll) placePick(ll.lat,ll.lng,18); });
    f.onsubmit=async e=>{
      e.preventDefault();
      const name=f.name.value.trim(); if(!name) return;
      const llStr=f.ll.value.trim(); const ll=parseLL(llStr);
      if(llStr && !ll){ $("#llMsg").textContent="この形式は読めなかった。「34.34, 134.05」の形にしてみて"; return; }
      const spot={name,building:f.building.value.trim(),floor:f.floor.value.trim(),address:f.address.value.trim(),note:f.note.value.trim(),
        lat:ll?ll.lat:"",lng:ll?ll.lng:""};
      const btn=f.querySelector('[type="submit"]'); btn.disabled=true; btn.textContent="保存中…";
      try{
        if(editing){ await post({action:"update",id:s.id,spot}); toast("保存した"); await load(true); openDetail(s.id); }
        else{ const j=await post({action:"add",spot}); toast("追加した"); await load(true); openDetail(j.id); }
      }catch(err){ toast("保存できなかった。電波を確認してもう一回"); btn.disabled=false; btn.textContent=editing?"変更を保存":"追加する"; }
    };
  }
  $("#addBtn").onclick=()=>openForm();

  // ---------- map ----------
  const HOME=[34.3505,134.0467]; // 高松駅あたり
  const M={map:null,markers:{},here:null,hereAcc:null,pick:null,pickMk:null};
  const tiles=()=>L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{maxZoom:19,maxNativeZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'});
  const goalIcon=()=>L.divIcon({className:"",html:'<div class="pin goalpin"></div>',iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-32]});
  const pinIcon=()=>L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-26]});
  function initMap(){
    if(M.map || !window.L) return;
    M.map=L.map("map",{zoomControl:true}).setView(HOME,14);
    tiles().addTo(M.map);
    const Btn=L.Control.extend({onAdd(){ const b=L.DomUtil.create("button","btn"); b.textContent="📍現在地"; b.style.minHeight="40px";
      L.DomEvent.disableClickPropagation(b); b.onclick=()=>locate(h=>{ if(h) M.map.setView([h.lat,h.lng],17); }); return b; }});
    new Btn({position:"bottomleft"}).addTo(M.map);
    let fitted=false;
    M.fitOnce=()=>{ if(fitted||M.noFit) return; const pts=state.spots.filter(hasLL).map(s=>[s.lat,s.lng]); if(pts.length){ M.map.fitBounds(pts,{padding:[30,30],maxZoom:16}); fitted=true; } };
  }
  function drawMarkers(){
    if(!M.map) return;
    const sig=JSON.stringify(filtered().filter(hasLL).map(s=>[s.id,s.lat,s.lng,s.name,s.building,s.floor]));
    if(sig===M.sig) return; M.sig=sig;
    Object.values(M.markers).forEach(m=>m.remove()); M.markers={};
    for(const s of filtered()){
      if(!hasLL(s)) continue;
      const b=[s.building,s.floor].filter(Boolean).join(" ");
      const div=document.createElement("div"); div.className="pop";
      div.innerHTML=`<b>${esc(s.name)}</b>${b?`<span>${esc(b)}</span>`:""}<button class="btn crate">ここへ行く</button><button class="btn ghost">詳細・コメント</button>`;
      const bs=div.querySelectorAll("button");
      bs[0].onclick=()=>{ M.map.closePopup(); goTo(s.id); };
      bs[1].onclick=()=>openDetail(s.id);
      M.markers[s.id]=L.marker([s.lat,s.lng],{icon:s.id===M.goal?goalIcon():pinIcon(),title:s.name,zIndexOffset:s.id===M.goal?1000:0}).bindPopup(div).addTo(M.map);
    }
    M.fitOnce && M.fitOnce();
  }
  function drawHere(){
    if(!M.map || !state.here) return;
    const p=[state.here.lat,state.here.lng];
    if(!M.here){
      M.hereAcc=L.circle(p,{radius:state.here.acc,color:"#2f80ed",weight:1,fillOpacity:.12}).addTo(M.map);
      M.here=L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#2f80ed",fillOpacity:1}).addTo(M.map);
    }else{ M.here.setLatLng(p); M.hereAcc.setLatLng(p).setRadius(state.here.acc); }
    drawGoal();
  }
  // ---------- 目的地（現在地と目的地を線で結ぶ） ----------
  function goTo(id){
    M.goal=id; M.sig=null; M.noFit=true;
    setTab("map");
    setTimeout(()=>{
      drawMarkers(); drawGoal(true);
      if(!state.here) locate(()=>drawGoal(true));
      startWatch();
    },60);
  }
  function clearGoal(){
    M.goal=null; M.sig=null; stopWatch();
    if(M.line){ M.line.remove(); M.line=null; }
    $("#goal").hidden=true; drawMarkers();
  }
  function drawGoal(fit){
    const s=state.spots.find(x=>x.id===M.goal);
    if(!M.map || !s || !hasLL(s)){ $("#goal").hidden=true; if(M.line){M.line.remove();M.line=null;} return; }
    $("#goal").hidden=false; $("#goalName").textContent=s.name+([s.building,s.floor].filter(Boolean).length?"（"+[s.building,s.floor].filter(Boolean).join(" ")+"）":"");
    const dest=[s.lat,s.lng];
    if(state.here){
      const here=[state.here.lat,state.here.lng];
      $("#goalDist").textContent=dir(state.here,s)+" "+fmtDist(km(state.here,s));
      if(!M.line) M.line=L.polyline([here,dest],{color:"#f2b705",weight:4,dashArray:"8 8",opacity:.9}).addTo(M.map);
      else M.line.setLatLngs([here,dest]);
      if(fit) M.map.fitBounds([here,dest],{padding:[70,40],maxZoom:18});
    }else{
      $("#goalDist").textContent="現在地を取得中…";
      if(fit) M.map.setView(dest,17);
    }
  }
  function startWatch(){
    if(M.watch!=null || !navigator.geolocation) return;
    M.watch=navigator.geolocation.watchPosition(p=>{
      state.here={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      $("#here").classList.add("on"); $("#hereTxt").innerHTML="<b>現在地オン</b> 誤差 約"+Math.round(p.coords.accuracy)+"m";
      drawHere();
    },()=>{}, {enableHighAccuracy:true,maximumAge:5000});
  }
  function stopWatch(){ if(M.watch!=null){ navigator.geolocation.clearWatch(M.watch); M.watch=null; } }
  $("#goalX").onclick=clearGoal;
  $("#goalFit").onclick=()=>drawGoal(true);
  function setTab(t){
    const map=t==="map";
    $("#tabList").setAttribute("aria-selected",!map); $("#tabMap").setAttribute("aria-selected",map);
    $("#list").hidden=map; $("#mapWrap").hidden=!map;
    if(!map) stopWatch(); else if(M.goal) startWatch();
    if(map){ initMap(); setTimeout(()=>{ M.map.invalidateSize(); drawMarkers(); drawHere(); },0); }
  }
  $("#tabList").onclick=()=>setTab("list");
  $("#tabMap").onclick=()=>setTab("map");

  function initPick(ll,onPick){
    if(!window.L) return;
    const c = ll ? [ll.lat,ll.lng] : (state.here ? [state.here.lat,state.here.lng] : (M.map ? M.map.getCenter() : HOME));
    M.pick=L.map("pickMap").setView(c, ll?18:16);
    tiles().addTo(M.pick);
    M.pickCb=onPick;
    if(ll) placePick(ll.lat,ll.lng);
    M.pick.on("click",e=>{ placePick(e.latlng.lat,e.latlng.lng); onPick(e.latlng.lat,e.latlng.lng); });
    setTimeout(()=>M.pick && M.pick.invalidateSize(),250);
  }
  function placePick(lat,lng,zoom){
    if(!M.pick) return;
    if(!M.pickMk){
      M.pickMk=L.marker([lat,lng],{icon:pinIcon(),draggable:true}).addTo(M.pick);
      M.pickMk.on("dragend",()=>{ const p=M.pickMk.getLatLng(); M.pickCb && M.pickCb(p.lat,p.lng); });
    }else M.pickMk.setLatLng([lat,lng]);
    if(zoom) M.pick.setView([lat,lng],zoom);
  }
  function killPick(){ if(M.pick){ M.pick.remove(); M.pick=null; M.pickMk=null; M.pickCb=null; } }

  // ---------- boot ----------
  (async ()=>{
    if(state.me){ enter(); load(false); }
    else showGate();
  })();
})();
</script>
</body>
</html>
